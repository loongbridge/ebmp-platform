server:
  port: 0

spring:
  application:
    name: ebmp-test
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:h2:mem:ebmp-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

app:
  jwt:
    secret: ebmp-test-enterprise-business-management-platform-secret-2026
    expire-hours: 12
  upload-dir: ./target/test-uploads
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,null
